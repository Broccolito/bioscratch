name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            extension/package-lock.json
      - run: npm ci
      - name: Install shared editor test dependencies
        run: npm ci
        working-directory: extension
      - run: npm audit --audit-level=low
      - run: npm run check:versions
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: npm run build:preview
      - name: Check frontmatter fixtures
        run: |
          npx --no-install esbuild scripts/test-frontmatter.mts --bundle --platform=node --format=cjs --outfile="$RUNNER_TEMP/bioscratch-frontmatter.cjs"
          node "$RUNNER_TEMP/bioscratch-frontmatter.cjs"

  rust:
    name: macOS backend and Quick Look
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - name: Check Quick Look Swift host and image helper
        run: |
          SWIFT_COMPILER="$(xcrun --find swiftc)"
          SWIFT_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          SWIFT_TARGET="$(uname -m)-apple-macosx11.0"
          "$SWIFT_COMPILER" -sdk "$SWIFT_SDK" -target "$SWIFT_TARGET" src-tauri/quicklook/PreviewImages.swift tests/quicklookImages.swift -o "$RUNNER_TEMP/bioscratch-quicklook-images"
          "$RUNNER_TEMP/bioscratch-quicklook-images"
          "$SWIFT_COMPILER" -sdk "$SWIFT_SDK" -target "$SWIFT_TARGET" -typecheck src-tauri/quicklook/PreviewImages.swift src-tauri/quicklook/PreviewViewController.swift -framework Cocoa -framework Quartz -framework WebKit
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --jobs 3

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run build
